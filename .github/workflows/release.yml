name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish theme zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches style.css version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          header="$(sed -n '1,40p' style.css | grep -i '^Version:' | head -1 | cut -d: -f2- | tr -d ' \r')"
          echo "tag:    $tag"
          echo "header: $header"
          if [ "$tag" != "$header" ]; then
            echo "::error::Tag v$tag does not match 'Version: $header' in style.css"
            exit 1
          fi

      - name: Build installable zip
        run: |
          set -euo pipefail
          mkdir -p build
          git archive --format=tar --prefix=osiera/ HEAD | tar -x -C build
          cd build
          zip -rq "osiera-${GITHUB_REF_NAME#v}.zip" osiera
          echo "--- archive top level ---"
          unzip -l "osiera-${GITHUB_REF_NAME#v}.zip" | head -12
          echo "--- size ---"
          du -h "osiera-${GITHUB_REF_NAME#v}.zip"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Installation

            Download the **`osiera-*.zip`** asset below (not "Source code") and upload it in
            WordPress: **Appearance → Themes → Add New → Upload Theme**.
            No need to extract it first.

            Already have Osiera installed? Back up first, then replace the theme folder
            or re-upload the zip — your content and settings are stored in the database,
            not in the theme.

            ## Which file do I need?

            | Asset | Top-level folder | Use it for |
            |---|---|---|
            | `osiera-${{ github.ref_name }}.zip` | `osiera/` | Installing on a WordPress site (this is the one you want) |
            | `Source code (zip)` | `osiera-${{ github.ref_name }}/` | Reviewing the code, or people who work with git |

            The "Source code" archives are generated by GitHub and contain the raw
            repository — they include no build step and are not packaged as a theme.
            If you extract one by hand you get an extra `osiera-<version>` folder inside
            whatever folder you extracted into; that extra layer is not part of the
            theme and must be removed before uploading.

            ## Requirements

            WordPress 6.0+, PHP 8.0+. The folder must be named `osiera`.

